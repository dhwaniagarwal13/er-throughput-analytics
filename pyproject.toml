[project]
name = "er-throughput-analytics"
version = "0.1.0"
description = "Emergency-department throughput and patient-flow analytics over hospital ER visit data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "pandas>=2.2",
    "pyarrow>=18",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "streamlit>=1.40",
    "plotly>=5.24",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "jupyter>=1.1", "pyyaml>=6.0", "kagglehub>=0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
